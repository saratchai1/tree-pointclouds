name: Improve LiDAR overlay visibility

on:
  push:
    paths:
      - .github/workflows/improve-lidar-overlays.yml

permissions:
  contents: write

jobs:
  patch-viewer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch viewer overlays and controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          viewer_path = Path('site/public/viewer/viewer.js')
          index_path = Path('site/public/viewer/index.html')
          js = viewer_path.read_text(encoding='utf-8')
          html = index_path.read_text(encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_count(text: str, old: str, new: str, expected: int, label: str) -> str:
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old, new)

          js = replace_once(
              js,
              "const DATA_VERSION = '?v=20260817-lidar-field-aid-v2';",
              "const DATA_VERSION = '?v=20260817-lidar-field-aid-v3-overlay-controls';",
              'data cache version',
          )

          js = replace_once(
              js,
              "const toggleMeasurementsEl = document.querySelector('#toggleMeasurements');\nconst exportMeasurementsEl = document.querySelector('#exportMeasurements');",
              "const toggleMeasurementsEl = document.querySelector('#toggleMeasurements');\nconst toggleMeasurementLabelsEl = document.querySelector('#toggleMeasurementLabels');\nconst exportMeasurementsEl = document.querySelector('#exportMeasurements');",
              'label toggle element',
          )

          js = replace_once(
              js,
              "const measurementLayer = new THREE.Group();\nmeasurementLayer.name = 'lidar-field-aid-measurements';\nscene.add(measurementLayer);\nconst selectionLayer = new THREE.Group();",
              "const measurementLayer = new THREE.Group();\nmeasurementLayer.name = 'lidar-field-aid-measurements';\nscene.add(measurementLayer);\nconst measurementLabelLayer = new THREE.Group();\nmeasurementLabelLayer.name = 'lidar-field-aid-measurement-labels';\nscene.add(measurementLabelLayer);\nconst selectionLayer = new THREE.Group();",
              'measurement label layer',
          )

          js = replace_once(
              js,
              "const measurementGroups = new Map();\nconst measurementHitTargets = [];",
              "const measurementGroups = new Map();\nconst measurementLabelGroups = new Map();\nconst measurementHitTargets = [];",
              'label group map',
          )

          old_ring_geometry = """function makeRingGeometry(record, selected = false) {
            const points = outlineSourcePoints(record).map((point) => toScene(point[0], point[1], point[2]));
            if (points.length < 4) return null;
            const curve = new THREE.CatmullRomCurve3(points, true, 'centripetal', 0.5);
            const baseTubeRadius = Math.max(0.008, Math.min(0.028, effectiveRadiusM(record) * 0.04));
            return new THREE.TubeGeometry(curve, 72, selected ? baseTubeRadius * 1.9 : baseTubeRadius, 6, true);
          }""".replace('          ', '')

          new_ring_geometry = """function makeRingGeometry(record, selected = false, halo = false) {
            const points = outlineSourcePoints(record).map((point) => toScene(point[0], point[1], point[2]));
            if (points.length < 4) return null;
            const curve = new THREE.CatmullRomCurve3(points, true, 'centripetal', 0.5);
            const baseTubeRadius = Math.max(0.018, Math.min(0.05, effectiveRadiusM(record) * 0.085));
            const thicknessScale = halo ? 2.15 : selected ? 1.75 : 1;
            return new THREE.TubeGeometry(curve, 72, baseTubeRadius * thicknessScale, 8, true);
          }""".replace('          ', '')

          js = replace_once(js, old_ring_geometry, new_ring_geometry, 'thicker ring geometry')

          overlay_helpers = """
          function makeLocatorSprite(record) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const context = canvas.getContext('2d');
            const color = `#${measurementColor(record).toString(16).padStart(6, '0')}`;
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.beginPath();
            context.arc(128, 128, 88, 0, Math.PI * 2);
            context.strokeStyle = 'rgba(0, 0, 0, .92)';
            context.lineWidth = 54;
            context.stroke();
            context.beginPath();
            context.arc(128, 128, 88, 0, Math.PI * 2);
            context.strokeStyle = color;
            context.lineWidth = 28;
            context.stroke();
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
              map: texture,
              depthTest: false,
              depthWrite: false,
              transparent: true,
            }));
            sprite.renderOrder = 16;
            sprite.userData.pixelWidth = 30;
            sprite.userData.pixelHeight = 30;
            sprite.userData.overlayType = 'ring';
            return sprite;
          }

          function makeCompactMeasurementLabel(record) {
            const canvas = document.createElement('canvas');
            canvas.width = 960;
            canvas.height = 240;
            const context = canvas.getContext('2d');
            const color = `#${measurementColor(record).toString(16).padStart(6, '0')}`;
            const treeNumber = record.tree_id.replace('TREE_', '');
            const valueText = record.field_aid_circumference_cm == null
              ? 'ไม่มีค่า'
              : `${fmt(record.field_aid_circumference_cm, 1)} ซม.`;
            context.fillStyle = 'rgba(2, 8, 5, .96)';
            context.fillRect(8, 8, canvas.width - 16, canvas.height - 16);
            context.strokeStyle = 'rgba(0, 0, 0, .95)';
            context.lineWidth = 34;
            context.strokeRect(17, 17, canvas.width - 34, canvas.height - 34);
            context.strokeStyle = color;
            context.lineWidth = 15;
            context.strokeRect(17, 17, canvas.width - 34, canvas.height - 34);
            context.textBaseline = 'middle';
            context.textAlign = 'center';
            context.fillStyle = '#ffffff';
            context.font = '900 92px system-ui, sans-serif';
            context.fillText(treeNumber, 225, 120);
            context.fillStyle = color;
            context.font = '900 76px system-ui, sans-serif';
            context.fillText(valueText, 650, 120);
            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.minFilter = THREE.LinearFilter;
            texture.generateMipmaps = false;
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
              map: texture,
              depthTest: false,
              depthWrite: false,
              transparent: true,
            }));
            sprite.center.set(0.5, 0);
            sprite.renderOrder = 28;
            sprite.userData.pixelWidth = 132;
            sprite.userData.pixelHeight = 33;
            sprite.userData.overlayType = 'label';
            return sprite;
          }
          """.replace('          ', '')

          js = replace_once(
              js,
              "function recordSceneCenter(record) {\n  const source = fitCenterSource(record) ?? record.plane?.center_xyz;\n  return source ? toScene(source[0], source[1], source[2]) : null;\n}\n\nfunction addMeasurementOverlay(record) {",
              "function recordSceneCenter(record) {\n  const source = fitCenterSource(record) ?? record.plane?.center_xyz;\n  return source ? toScene(source[0], source[1], source[2]) : null;\n}\n\n" + overlay_helpers.strip() + "\n\nfunction addMeasurementOverlay(record) {",
              'overlay helper insertion',
          )

          js = replace_once(
              js,
              "  marker.scale.setScalar(record.renderable ? 0.82 : 1.25);\n  marker.renderOrder = 14;\n  marker.userData.treeId = record.tree_id;\n  marker.userData.kind = 'marker';",
              "  const markerBaseScale = record.renderable ? 1.1 : 1.5;\n  marker.scale.setScalar(markerBaseScale);\n  marker.renderOrder = 14;\n  marker.userData.treeId = record.tree_id;\n  marker.userData.kind = 'marker';\n  marker.userData.baseScale = markerBaseScale;\n  marker.userData.overlayType = 'ring';",
              'larger center marker',
          )

          js = replace_once(
              js,
              "  group.add(marker);\n  measurementHitTargets.push(marker);\n\n  if (record.renderable) {",
              "  group.add(marker);\n  measurementHitTargets.push(marker);\n\n  const locator = makeLocatorSprite(record);\n  locator.position.copy(sceneCenter);\n  locator.userData.treeId = record.tree_id;\n  locator.userData.kind = 'locator';\n  group.add(locator);\n  measurementHitTargets.push(locator);\n\n  if (record.renderable) {",
              'screen-space locator',
          )

          old_ring_block = """  if (record.renderable) {
            const geometry = makeRingGeometry(record);
            if (geometry) {
              const ring = new THREE.Mesh(
                geometry,
                new THREE.MeshBasicMaterial({
                  color: measurementColor(record),
                  transparent: true,
                  opacity: record.field_aid_status === 'READY_FOR_FIELD_USE' ? 0.98 : 0.82,
                  depthTest: false,
                  depthWrite: false,
                })
              );
              ring.renderOrder = 13;
              ring.userData.treeId = record.tree_id;
              ring.userData.kind = 'ring';
              group.add(ring);
              measurementHitTargets.push(ring);
            }
          }

          measurementGroups.set(record.tree_id, group);""".replace('          ', '')

          new_ring_block = """  if (record.renderable) {
            const haloGeometry = makeRingGeometry(record, false, true);
            const geometry = makeRingGeometry(record);
            if (haloGeometry && geometry) {
              const ringHalo = new THREE.Mesh(
                haloGeometry,
                new THREE.MeshBasicMaterial({
                  color: 0x010403,
                  transparent: true,
                  opacity: 0.88,
                  depthTest: false,
                  depthWrite: false,
                })
              );
              ringHalo.renderOrder = 12;
              ringHalo.userData.treeId = record.tree_id;
              ringHalo.userData.kind = 'ring-halo';
              ringHalo.userData.overlayType = 'ring';
              group.add(ringHalo);

              const ring = new THREE.Mesh(
                geometry,
                new THREE.MeshBasicMaterial({
                  color: measurementColor(record),
                  transparent: true,
                  opacity: 1,
                  depthTest: false,
                  depthWrite: false,
                })
              );
              ring.renderOrder = 13;
              ring.userData.treeId = record.tree_id;
              ring.userData.kind = 'ring';
              ring.userData.overlayType = 'ring';
              group.add(ring);
              measurementHitTargets.push(ring);
            }
          }

          const compactLabel = makeCompactMeasurementLabel(record);
          compactLabel.position.copy(sceneCenter).add(new THREE.Vector3(
            0,
            Math.max(0.28, effectiveRadiusM(record) * 1.65),
            0
          ));
          compactLabel.userData.treeId = record.tree_id;
          compactLabel.userData.kind = 'label';
          measurementLabelGroups.set(record.tree_id, compactLabel);
          measurementLabelLayer.add(compactLabel);
          measurementHitTargets.push(compactLabel);

          measurementGroups.set(record.tree_id, group);""".replace('          ', '')

          js = replace_once(js, old_ring_block, new_ring_block, 'ring contrast and compact labels')

          js = replace_once(
              js,
              "  sprite.scale.set(3.7, 0.79, 1);\n  sprite.renderOrder = 30;\n  return sprite;",
              "  sprite.center.set(0.5, 0);\n  sprite.renderOrder = 30;\n  sprite.userData.pixelWidth = 390;\n  sprite.userData.pixelHeight = 84;\n  sprite.userData.overlayType = 'label';\n  return sprite;",
              'selected label screen size',
          )

          visibility_helpers = """
          function scaleSpriteToPixels(sprite) {
            const pixelWidth = sprite.userData.pixelWidth;
            const pixelHeight = sprite.userData.pixelHeight;
            if (!pixelWidth || !pixelHeight) return;
            const distance = Math.max(camera.position.distanceTo(sprite.position), camera.near);
            const worldPerPixel = (
              2
              * distance
              * Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5))
              / Math.max(renderer.domElement.clientHeight, 1)
            );
            sprite.scale.set(pixelWidth * worldPerPixel, pixelHeight * worldPerPixel, 1);
          }

          function updateScreenSpaceOverlays() {
            for (const layer of [measurementLayer, measurementLabelLayer, selectionLayer]) {
              layer.traverse((object) => {
                if (object.isSprite) scaleSpriteToPixels(object);
              });
            }
          }

          function setOverlayButtonState(button, visible, label) {
            button.textContent = `${label}: ${visible ? 'เปิด' : 'ปิด'}`;
            button.setAttribute('aria-pressed', String(visible));
          }

          function syncOverlayVisibility() {
            const ringsVisible = measurementLayer.visible;
            const labelsVisible = measurementLabelLayer.visible;
            selectionLayer.visible = ringsVisible || labelsVisible;
            selectionLayer.traverse((object) => {
              if (object.userData.overlayType === 'ring') object.visible = ringsVisible;
              if (object.userData.overlayType === 'label') object.visible = labelsVisible;
            });
            setOverlayButtonState(toggleMeasurementsEl, ringsVisible, 'วงวัด');
            setOverlayButtonState(toggleMeasurementLabelsEl, labelsVisible, 'ตัวเลข');
          }
          """.replace('          ', '')

          js = replace_once(
              js,
              "  return sprite;\n}\n\nfunction updateSelectedDetail(record) {",
              "  return sprite;\n}\n\n" + visibility_helpers.strip() + "\n\nfunction updateSelectedDetail(record) {",
              'visibility helper insertion',
          )

          js = replace_count(
              js,
              "    halo.renderOrder = 25;\n    selectionLayer.add(halo);",
              "    halo.renderOrder = 25;\n    halo.userData.overlayType = 'ring';\n    selectionLayer.add(halo);",
              2,
              'selected halo visibility tags',
          )

          js = replace_once(
              js,
              "  axisLine.computeLineDistances();\n  axisLine.renderOrder = 24;\n  selectionLayer.add(axisLine);",
              "  axisLine.computeLineDistances();\n  axisLine.renderOrder = 24;\n  axisLine.userData.overlayType = 'ring';\n  selectionLayer.add(axisLine);",
              'axis visibility tag',
          )

          js = replace_once(
              js,
              "  const label = makeMeasurementLabel(record);\n  label.position.copy(target).add(new THREE.Vector3(0, Math.max(0.72, effectiveRadiusM(record) * 2.2), 0));\n  selectionLayer.add(label);",
              "  const label = makeMeasurementLabel(record);\n  label.position.copy(target).add(new THREE.Vector3(0, Math.max(0.72, effectiveRadiusM(record) * 2.2), 0));\n  selectionLayer.add(label);\n  syncOverlayVisibility();",
              'selected label visibility sync',
          )

          js = replace_once(
              js,
              "    const group = measurementGroups.get(record.tree_id);\n    if (group) group.visible = visibleIds.has(record.tree_id);",
              "    const group = measurementGroups.get(record.tree_id);\n    const label = measurementLabelGroups.get(record.tree_id);\n    const visible = visibleIds.has(record.tree_id);\n    if (group) group.visible = visible;\n    if (label) label.visible = visible;",
              'filter label visibility',
          )

          js = replace_once(
              js,
              "  toggleMeasurementsEl.disabled = false;\n  exportMeasurementsEl.disabled = false;",
              "  toggleMeasurementsEl.disabled = false;\n  toggleMeasurementLabelsEl.disabled = false;\n  exportMeasurementsEl.disabled = false;\n  syncOverlayVisibility();",
              'enable label toggle',
          )

          old_toggle = """toggleMeasurementsEl.addEventListener('click', () => {
            measurementLayer.visible = !measurementLayer.visible;
            selectionLayer.visible = measurementLayer.visible;
            toggleMeasurementsEl.textContent = measurementLayer.visible ? 'ซ่อนวงวัด' : 'แสดงวงวัด';
          });""".replace('          ', '')

          new_toggle = """toggleMeasurementsEl.addEventListener('click', () => {
            measurementLayer.visible = !measurementLayer.visible;
            syncOverlayVisibility();
          });
          toggleMeasurementLabelsEl.addEventListener('click', () => {
            measurementLabelLayer.visible = !measurementLabelLayer.visible;
            syncOverlayVisibility();
          });""".replace('          ', '')

          js = replace_once(js, old_toggle, new_toggle, 'independent overlay toggles')

          js = replace_once(
              js,
              "  if (movement <= 5 && measurementLayer.visible) selectMeasurementAtPointer(event);",
              "  if (movement <= 5 && (measurementLayer.visible || measurementLabelLayer.visible)) {\n    selectMeasurementAtPointer(event);\n  }",
              'label click selection',
          )

          js = replace_once(
              js,
              "renderer.setAnimationLoop(() => {\n  controls.update();\n  renderer.render(scene, camera);\n});",
              "renderer.setAnimationLoop(() => {\n  controls.update();\n  updateScreenSpaceOverlays();\n  renderer.render(scene, camera);\n});",
              'screen-space overlay animation',
          )

          html = replace_once(
              html,
              "    .measure-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }\n    .measure-actions button { min-height: 32px; padding: 0 6px; font-size: 9px; }",
              "    .measure-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }\n    .measure-actions button { min-height: 34px; padding: 0 7px; font-size: 10px; }\n    .measure-actions button[aria-pressed=\"true\"] { border-color: rgba(114, 216, 255, .68); background: rgba(114, 216, 255, .14); color: #f2fbff; }\n    .measure-actions button[aria-pressed=\"false\"] { color: #8fa399; background: rgba(255,255,255,.025); }",
              'overlay button styles',
          )

          html = replace_once(
              html,
              "      <p class=\"measure-copy\">วงใช้ระนาบตั้งฉากกับแกนลำต้นและโมเดล circle/ellipse จาก marking รายต้น ไม่บังคับทุกต้นให้วัดที่ 1.30 ม.; กรณี prop-root ใช้จุดเกาะรากสูงสุด +0.30 ม.</p>",
              "      <p class=\"measure-copy\">วงใช้ระนาบตั้งฉากกับแกนลำต้นและโมเดล circle/ellipse จาก marking รายต้น ไม่บังคับทุกต้นให้วัดที่ 1.30 ม.; กรณี prop-root ใช้จุดเกาะรากสูงสุด +0.30 ม. ป้ายตัวเลขรักษาขนาดบนหน้าจอ จึงอ่านได้แม้ซูมออก.</p>",
              'overlay visibility explanation',
          )

          html = replace_once(
              html,
              "      <div class=\"measure-actions\">\n        <button id=\"showAllTrees\" disabled>ดูวงตามตัวกรอง</button>\n        <button id=\"toggleMeasurements\" disabled>ซ่อนวงวัด</button>\n        <button id=\"exportMeasurements\" disabled>ส่งออก CSV</button>\n      </div>",
              "      <div class=\"measure-actions\">\n        <button id=\"showAllTrees\" disabled>ดูตามตัวกรอง</button>\n        <button id=\"toggleMeasurements\" type=\"button\" aria-pressed=\"true\" disabled>วงวัด: เปิด</button>\n        <button id=\"toggleMeasurementLabels\" type=\"button\" aria-pressed=\"true\" disabled>ตัวเลข: เปิด</button>\n        <button id=\"exportMeasurements\" disabled>ส่งออก CSV</button>\n      </div>",
              'independent overlay controls',
          )

          html = replace_once(
              html,
              "  <div id=\"hint\">ลากเพื่อหมุน · คลิกวงเพื่อเลือก · คลิกขวาเพื่อเลื่อน · หมุนล้อเพื่อซูม</div>",
              "  <div id=\"hint\">ลากเพื่อหมุน · คลิกวงหรือป้ายตัวเลขเพื่อเลือก · คลิกขวาเพื่อเลื่อน · หมุนล้อเพื่อซูม</div>",
              'interaction hint',
          )

          required_js = [
              'toggleMeasurementLabelsEl',
              'measurementLabelLayer',
              'makeCompactMeasurementLabel',
              'makeLocatorSprite',
              'updateScreenSpaceOverlays',
              'syncOverlayVisibility',
          ]
          for token in required_js:
              if token not in js:
                  raise RuntimeError(f'missing JS token after patch: {token}')
          if html.count('id="toggleMeasurementLabels"') != 1:
              raise RuntimeError('label toggle button was not inserted exactly once')

          viewer_path.write_text(js, encoding='utf-8')
          index_path.write_text(html, encoding='utf-8')
          PY

      - name: Validate JavaScript and changed markup
        shell: bash
        run: |
          node --check site/public/viewer/viewer.js
          grep -q 'id="toggleMeasurementLabels"' site/public/viewer/index.html
          grep -q 'makeCompactMeasurementLabel' site/public/viewer/viewer.js
          git diff --check

      - name: Commit viewer upgrade and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/improve-lidar-overlays.yml
          git add site/public/viewer/index.html site/public/viewer/viewer.js
          git commit -m "Improve LiDAR ring visibility and overlay controls"
          git push origin HEAD:main
