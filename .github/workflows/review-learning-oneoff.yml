name: One-off human review learning validation

on:
  push:
    branches: [feat/review-feedback-learning-20261009]
    paths: [.github/workflows/review-learning-oneoff.yml]

permissions:
  contents: read

jobs:
  train-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - name: Check out only existing review evidence and the new module
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /annotations/
            /outputs/review_queue_v2_phase1_75_pilot.json
            /scripts/review_learning.py
            /tests/test_review_learning.py
            /requirements-feedback-learning.txt
      - name: Verify exact locally tested source
        shell: bash
        run: |
          test "$(git hash-object scripts/review_learning.py)" = e3d88d89030a2e74fa0084ead573a5e8c8055f48
          test "$(git hash-object tests/test_review_learning.py)" = 64657c5a695e725118be0b85adfcaae4170e9f48
      - name: Install isolated learning dependencies
        run: python3 -m pip install -r requirements-feedback-learning.txt
      - name: Run contract tests
        run: python3 -m unittest discover -s tests -p 'test_review_learning.py' -v
      - name: Train and evaluate using original human reviews
        run: python3 scripts/review_learning.py train --output .feedback-learning
      - name: Expose compact report and actual model for audit
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.feedback-learning')
          report = json.loads((root/'report.json').read_text())
          print('LABEL_AUDIT_JSON=' + json.dumps(report['audit'], sort_keys=True))
          for pointer in root.glob('*.latest.json'):
              path = root/json.loads(pointer.read_text())['model_file']
              print('TRAINED_MODEL_JSON=' + json.dumps(json.loads(path.read_text()), sort_keys=True))
          PY
      - name: Save model and validation artifacts, not raw LAS
        uses: actions/upload-artifact@v4
        with:
          name: human-review-learning-v1
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .feedback-learning/report.json
            .feedback-learning/dataset.json
            .feedback-learning/suggestions.json
            .feedback-learning/stem_identity-*.json
            .feedback-learning/measurement_validity-*.json
