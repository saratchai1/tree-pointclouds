name: Rayong small-stem sensitivity

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/rayong-cfo-dbh-screening-20260904
    paths:
      - 'scripts/rayong_sample_small_stem_cylinder.py'
      - '.github/workflows/rayong-small-stem-sensitivity.yml'

permissions:
  contents: write

jobs:
  sensitivity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade numpy scipy
      - name: Run sensitivity matrix
        shell: bash
        run: |
          mkdir -p sensitivity-results/rayong-small-stem
          configs=(
            'base|0.08|70|40'
            'finegrid|0.06|70|40'
            'coarsegrid|0.10|70|40'
            'moreseeds|0.08|60|40'
            'fewerseeds|0.08|80|40'
            'finebins|0.08|70|52'
            'coarsebins|0.08|70|30'
          )
          for cfg in "${configs[@]}"; do
            IFS='|' read -r name grid pct bins <<< "$cfg"
            for site in site-001 site-002; do
              if [[ "$site" == 'site-001' ]]; then
                data='rayong-preview/data'; meta='rayong-preview/data/metadata.json'
              else
                data='rayong-preview/site-002/data'; meta='rayong-preview/site-002/data/metadata.json'
              fi
              python scripts/rayong_sample_small_stem_cylinder.py \
                --data "$data" --metadata "$meta" --site "$site" \
                --grid "$grid" --seed-percentile "$pct" --radial-bins "$bins" \
                --output "sensitivity-results/rayong-small-stem/${site}-${name}.json"
            done
          done
      - name: Summarize sensitivity
        run: |
          python - <<'PY'
          import json, statistics
          from pathlib import Path
          root=Path('sensitivity-results/rayong-small-stem')
          summary={'measurementStatus':'SAMPLED_SMALL_STEM_SENSITIVITY','sites':{}}
          for site in ('site-001','site-002'):
              rows=[]
              for p in sorted(root.glob(f'{site}-*.json')):
                  d=json.loads(p.read_text())
                  rows.append({'variant':p.stem[len(site)+1:],'parameters':d['parameters'],'A_n':(d.get('aStats') or {}).get('n',0),'A_medianCm':(d.get('aStats') or {}).get('medianCm'),'A_p25Cm':(d.get('aStats') or {}).get('p25Cm'),'A_p75Cm':(d.get('aStats') or {}).get('p75Cm'),'AB_medianCm':(d.get('aPlusBStats') or {}).get('medianCm')})
              med=[r['A_medianCm'] for r in rows if r['A_medianCm'] is not None]
              summary['sites'][site]={'variants':rows,'medianOfVariantMediansCm':round(statistics.median(med),2),'minVariantMedianCm':min(med),'maxVariantMedianCm':max(med),'spreadCm':round(max(med)-min(med),2)}
          root.joinpath('summary.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Commit sensitivity outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f sensitivity-results/rayong-small-stem/*.json
          git commit -m 'analysis: add Rayong small-stem sensitivity results'
          git push origin HEAD:${GITHUB_REF_NAME}
