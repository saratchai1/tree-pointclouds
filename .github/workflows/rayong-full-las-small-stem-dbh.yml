name: Rayong full LAS small-stem DBH

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/rayong-cfo-dbh-screening-20260904
    paths:
      - 'scripts/rayong_full_las_small_stem_dbh.py'
      - '.github/workflows/rayong-full-las-small-stem-dbh.yml'

permissions:
  contents: write

concurrency:
  group: rayong-full-las-small-stem-dbh
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade numpy scipy laspy gdown
      - name: Process site-001 full LAS
        run: |
          mkdir -p outputs/rayong-full-las
          gdown 1EYPxhCs_4fTpkaFj1a00nTOlEA1dfLYU -O /tmp/rayong-site-001.las
          python scripts/rayong_full_las_small_stem_dbh.py --input /tmp/rayong-site-001.las --site site-001 --output outputs/rayong-full-las/site-001.json
          rm -f /tmp/rayong-site-001.las
      - name: Process site-002 full LAS
        run: |
          gdown 15xdpaxDm-P1hkFbZX8jgzuvZIbrMIC_l -O /tmp/rayong-site-002.las
          python scripts/rayong_full_las_small_stem_dbh.py --input /tmp/rayong-site-002.las --site site-002 --output outputs/rayong-full-las/site-002.json
          rm -f /tmp/rayong-site-002.las
      - name: Build CFO summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sites=[]
          for p in [Path('outputs/rayong-full-las/site-001.json'),Path('outputs/rayong-full-las/site-002.json')]:
              d=json.loads(p.read_text())
              sites.append({k:d.get(k) for k in ['siteId','source','candidateSeedCount','retainedCount','statusCounts','aStats','aPlusBStats','globalGroundEstimateZ']})
          Path('outputs/rayong-full-las/summary.json').write_text(json.dumps({'measurementStatus':'PRELIMINARY_FULL_LAS_SMALL_STEM_SCREENING','sites':sites},indent=2)+'\n')
          print(json.dumps(sites,indent=2))
          PY
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/rayong-full-las/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: generate Rayong full-LAS small-stem DBH screening'
          git push origin HEAD:${GITHUB_REF_NAME}
