name: Rayong sample small-stem cylinder

on:
  workflow_dispatch:
  push:
    branches:
      - analysis/rayong-cfo-dbh-screening-20260904
    paths:
      - 'scripts/rayong_sample_small_stem_cylinder.py'
      - '.github/workflows/rayong-sample-small-stem-cylinder.yml'

permissions:
  contents: write

concurrency:
  group: rayong-sample-small-stem-cylinder
  cancel-in-progress: true

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade numpy scipy
      - name: Run site-001 small-stem screen
        run: |
          mkdir -p outputs/rayong-small-stem-sample
          python scripts/rayong_sample_small_stem_cylinder.py \
            --data rayong-preview/data \
            --metadata rayong-preview/data/metadata.json \
            --site site-001 \
            --output outputs/rayong-small-stem-sample/site-001.json
      - name: Run site-002 small-stem screen
        run: |
          python scripts/rayong_sample_small_stem_cylinder.py \
            --data rayong-preview/site-002/data \
            --metadata rayong-preview/site-002/data/metadata.json \
            --site site-002 \
            --output outputs/rayong-small-stem-sample/site-002.json
      - name: Build summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          sites=[]
          for name in ('site-001','site-002'):
              d=json.loads(Path(f'outputs/rayong-small-stem-sample/{name}.json').read_text())
              sites.append({k:d.get(k) for k in ['siteId','sourceLas','sourcePointCount','viewerPointCount','samplingStride','seedCount','retainedCount','statusCounts','aStats','aPlusBStats']})
          Path('outputs/rayong-small-stem-sample/summary.json').write_text(json.dumps({'measurementStatus':'SAMPLED_SMALL_STEM_CYLINDER_SCREENING','sites':sites},indent=2)+'\n')
          print(json.dumps(sites,indent=2))
          PY
      - name: Commit outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add outputs/rayong-small-stem-sample/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'analysis: generate Rayong small-stem cylinder screening'
          git push origin HEAD:${GITHUB_REF_NAME}
